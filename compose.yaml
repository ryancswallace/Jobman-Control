---
services:
  postgres:
    image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: jobman_control
      POSTGRES_PASSWORD: jobman-control-development
    ports:
      - "127.0.0.1:${JOBMAN_CONTROL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U postgres -d jobman_control
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - jobman-control-postgres:/var/lib/postgresql/data

volumes:
  jobman-control-postgres:
