---
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: read-all

concurrency:
  group: jobman-control-release
  cancel-in-progress: false

jobs:
  release:
    name: Build signed draft release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: main
      url: https://github.com/ryancswallace/jobman-control/releases/tag/${{ github.ref_name }}
    permissions:
      attestations: write
      artifact-metadata: write
      contents: write
      id-token: write
      packages: write
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_DB: jobman_control_test
          POSTGRES_PASSWORD: jobman-control-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d jobman_control_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version such as v0.1.0." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit on main." >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.version
          check-latest: true
          cache-dependency-path: go.sum

      - name: Revalidate release source
        env:
          JOBMAN_CONTROL_TEST_DATABASE_URL: >-
            postgres://postgres:jobman-control-test@127.0.0.1:5432/jobman_control_test?sslmode=disable
        run: >-
          make mod-check format-check lint vet workflow-check shellcheck
          vulncheck contracts-check coverage-check docs cross-build
          release-check release-build build docker-smoke integration-test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver-opts: image=moby/buildkit@sha256:2f5adac4ecd194d9f8c10b7b5d7bceb5186853db1b26e5abd3a657af0b7e26ec

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v1.46.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and upload signed artifacts to a draft
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean --parallelism 1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify complete release artifact set
        run: ./devel/check-release.sh dist signed

      - name: Install native packages in target distributions
        run: ./devel/package-smoke.sh dist

      - name: Prepare attestation input
        run: |
          checksum_files=(dist/jobman-control_*_checksums.txt)
          if [[ ${#checksum_files[@]} -ne 1 || ! -f "${checksum_files[0]}" ]]; then
            echo "Expected exactly one checksum manifest." >&2
            exit 1
          fi
          cp "${checksum_files[0]}" dist/attestation-checksums.txt

      - name: Attest release artifacts
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: dist/attestation-checksums.txt
