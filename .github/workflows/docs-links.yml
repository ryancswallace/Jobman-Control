---
name: Docs links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - ".github/workflows/docs-links.yml"
      - "*.md"
      - "api/**"
      - "docs/**"
      - "etc/**"
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobman-control-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  links:
    name: Check documentation links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check HTTPS links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress
            --max-concurrency 16
            --max-retries 3
            --retry-wait-time 2
            --timeout 30
            --accept '100..=103,200..=299,500,502,503,504'
            --scheme https
            --exclude '^https://([^.]+\.)?example\.(com|invalid)/'
            --exclude '^https://api\.securityscorecards\.dev/'
            --exclude '^https://securityscorecards\.dev/'
            --exclude '^https://codecov\.io/'
            --exclude '^https://github\.com/ryancswallace/jobman-control/actions/workflows/[^/]+/badge\.svg$'
            --exclude '^https://token\.actions\.githubusercontent\.com/?$'
            './*.md'
            './docs/**/*.md'
            './.github/**/*.md'
          fail: true
          failIfEmpty: true
          lycheeVersion: v0.24.2
          token: ${{ github.token }}
