---
name: Publish staged release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable draft tag to verify and publish
        required: true
        type: string

permissions: read-all

concurrency:
  group: jobman-control-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish retained draft
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: main
      url: https://github.com/ryancswallace/jobman-control/releases/tag/${{ inputs.tag }}
    permissions:
      actions: write
      attestations: read
      contents: write
      packages: read
    steps:
      - name: Checkout trusted verification logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve retained draft
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "${RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable semantic version tag such as v0.1.0." >&2
            exit 1
          fi
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          source_commit=$(git rev-parse --verify "${RELEASE_TAG}^{commit}")
          if ! git merge-base --is-ancestor "${source_commit}" origin/main; then
            echo "${RELEASE_TAG} must point to a commit on main." >&2
            exit 1
          fi
          state=$(gh release view "${RELEASE_TAG}" --repo ryancswallace/jobman-control \
            --json databaseId,isDraft,isPrerelease,tagName \
            --jq '[.databaseId,.isDraft,.isPrerelease,.tagName] | @tsv')
          IFS=$'\t' read -r release_id draft prerelease resolved_tag <<< "${state}"
          if [[ "${draft}" != true || "${prerelease}" != false || "${resolved_tag}" != "${RELEASE_TAG}" ]]; then
            echo "${RELEASE_TAG} is not the exact retained stable draft." >&2
            exit 1
          fi
          echo "id=${release_id}" >> "${GITHUB_OUTPUT}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify staged assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir -p dist
          gh release download "${RELEASE_TAG}" --repo ryancswallace/jobman-control --dir dist
          ./devel/check-release.sh dist signed
          manifest="dist/jobman-control_${RELEASE_TAG#v}_checksums.txt"
          cosign verify-blob \
            --bundle "${manifest}.sigstore.json" \
            --certificate-identity \
              "https://github.com/ryancswallace/jobman-control/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${manifest}"
          while read -r _ filename; do
            gh attestation verify "dist/${filename}" \
              --repo ryancswallace/jobman-control \
              --signer-workflow ryancswallace/jobman-control/.github/workflows/release.yml \
              --source-ref "refs/tags/${RELEASE_TAG}" >/dev/null
          done < "${manifest}"
          mkdir -p verify-bin
          tar -xzf "dist/jobman-control_${RELEASE_TAG#v}_linux_amd64.tar.gz" \
            -C verify-bin jobman-control
          verify-bin/jobman-control --version \
            | grep -F "jobman-control ${RELEASE_TAG#v}"
          cosign verify \
            --certificate-identity \
              "https://github.com/ryancswallace/jobman-control/.github/workflows/release.yml@refs/tags/${RELEASE_TAG}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/ryancswallace/jobman-control:${RELEASE_TAG}" >/dev/null

      - name: Publish exact verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          published=$(gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
            -F draft=false -F prerelease=false \
            --jq '[.id,.draft,.prerelease] | @tsv')
          if [[ "${published}" != "${RELEASE_ID}"$'\tfalse\tfalse' ]]; then
            echo "GitHub did not publish the exact verified release ID." >&2
            exit 1
          fi

      - name: Dispatch post-release distribution
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh workflow run publish-homebrew-formula.yml --repo "${GITHUB_REPOSITORY}" \
            --ref main -f "tag=${RELEASE_TAG}"
          gh workflow run publish-cloudsmith-packages.yml --repo "${GITHUB_REPOSITORY}" \
            --ref main -f "tag=${RELEASE_TAG}"
