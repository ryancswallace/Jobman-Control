---
name: Publish Linux packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to publish or repair
        required: true
        type: string

concurrency:
  group: jobman-control-cloudsmith
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    name: Publish verified packages to Cloudsmith
    if: >-
      (github.event_name == 'release' && !github.event.release.prerelease) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: main
      url: https://cloudsmith.io/~jobman/repos/stable/
    steps:
      - name: Checkout trusted publication logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Authenticate to Cloudsmith
        uses: cloudsmith-io/cloudsmith-cli-action@ad73fafb92e3e29a5166c529464c2df7658a608e # v3.1.0
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          cli-version: 1.21.0
          verify-auth: "true"
      - name: Publish verified Linux packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        run: ./devel/publish-cloudsmith-packages.sh "${RELEASE_TAG}"
