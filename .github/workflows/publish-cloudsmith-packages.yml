---
name: Publish Linux packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag to publish or repair
        required: true
        type: string

concurrency:
  group: jobman-control-cloudsmith
  cancel-in-progress: false

permissions: read-all

jobs:
  publish:
    name: Publish verified packages to Cloudsmith
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    environment:
      name: main
      url: https://cloudsmith.io/~jobman/repos/stable/
    steps:
      - name: Checkout trusted publication logic
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Authenticate to Cloudsmith
        uses: cloudsmith-io/cloudsmith-cli-action@92b1383b22bbd36d804b858f273abcdf4d349f6b # v3.2.1
        with:
          api-key: ${{ secrets.CLOUDSMITH_API_KEY }}
          cli-version: 1.21.0
          verify-auth: "true"
      - name: Publish verified Linux packages
        env:
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: ./devel/publish-cloudsmith-packages.sh "${RELEASE_TAG}"
