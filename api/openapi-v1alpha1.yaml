            createdAt: {type: string, format: date-time}
            updatedAt: {type: string, format: date-time}
        spec:
          type: object
          additionalProperties: false
          required: [maxActive, failurePolicy, arrayPolicy]
          properties:
            maxActive: {type: integer, minimum: 1, maximum: 10000}
            failurePolicy: {enum: [continue, fail-fast]}
            arrayPolicy: {enum: [never, prefer, require]}
        status:
          type: object
          additionalProperties: false
          required: [phase, arrayMode, total, active, terminal, succeeded, failed, cancelled]
          properties:
            phase: {enum: [accepted, running, terminal]}
            outcome: {enum: [success, failure, cancelled]}
            arrayMode: {enum: [individual, slurm-array]}
            total: {type: integer, minimum: 1, maximum: 10000}
            active: {type: integer, minimum: 0, maximum: 10000}
            terminal: {type: integer, minimum: 0, maximum: 10000}
            succeeded: {type: integer, minimum: 0, maximum: 10000}
            failed: {type: integer, minimum: 0, maximum: 10000}
            cancelled: {type: integer, minimum: 0, maximum: 10000}
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [index, name, job]
            properties:
              index: {type: integer, minimum: 0, maximum: 9999}
              name: {$ref: "#/components/schemas/Name"}
              job: {$ref: "#/components/schemas/Job"}
    Graph:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, metadata, spec, status, items]
      properties:
        apiVersion: {const: jobman.control/v1alpha1}
        kind: {const: Graph}
        metadata:
          type: object
          additionalProperties: false
          required: [id, namespace, name, revision, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            namespace: {$ref: "#/components/schemas/Name"}
            name: {$ref: "#/components/schemas/Name"}
            labels: {type: object, additionalProperties: {type: string}}
