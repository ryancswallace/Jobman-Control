            updatedAt: {type: string, format: date-time}
        spec:
          type: object
          additionalProperties: false
          required: [maxActive, unsatisfiedPolicy]
          properties:
            maxActive: {type: integer, minimum: 1, maximum: 10000}
            unsatisfiedPolicy: {enum: [skip, cancel, blocked]}
        status:
          type: object
          additionalProperties: false
          required: [phase, total, waiting, active, terminal, succeeded, failed, cancelled, skipped, blocked]
          properties:
            phase: {enum: [accepted, running, terminal]}
            outcome: {enum: [success, failure, cancelled]}
            total: {type: integer, minimum: 1, maximum: 10000}
            waiting: {type: integer, minimum: 0, maximum: 10000}
            active: {type: integer, minimum: 0, maximum: 10000}
            terminal: {type: integer, minimum: 0, maximum: 10000}
            succeeded: {type: integer, minimum: 0, maximum: 10000}
            failed: {type: integer, minimum: 0, maximum: 10000}
            cancelled: {type: integer, minimum: 0, maximum: 10000}
            skipped: {type: integer, minimum: 0, maximum: 10000}
            blocked: {type: integer, minimum: 0, maximum: 10000}
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items:
            type: object
            additionalProperties: false
            required: [index, name, job]
            properties:
              index: {type: integer, minimum: 0, maximum: 9999}
