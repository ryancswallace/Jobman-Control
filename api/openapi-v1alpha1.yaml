    Collection:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, metadata, spec, status, items]
      properties:
        apiVersion: {const: jobman.control/v1alpha1}
        kind: {const: Collection}
        metadata:
          type: object
          additionalProperties: false
          required: [id, namespace, name, revision, createdAt, updatedAt]
          properties:
            id: {type: string, format: uuid}
            namespace: {$ref: "#/components/schemas/Name"}
            name: {$ref: "#/components/schemas/Name"}
            labels: {type: object, additionalProperties: {type: string}}
